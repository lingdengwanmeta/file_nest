name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: 接受 Android 许可
        run: yes | flutter doctor --android-licenses || true

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 生成 Android 平台工程（脚手架）
        run: |
          SCAFFOLD="${RUNNER_TEMP}/scaffold"
          rm -rf "$SCAFFOLD"
          flutter create --org com.example --project-name file_nest --platforms android "$SCAFFOLD"
          cp -R "$SCAFFOLD/android" ./android
          if [ -f "$SCAFFOLD/.metadata" ]; then cp "$SCAFFOLD/.metadata" ./.metadata; fi
          echo "--- android 目录内容 ---"
          ls -1 ./android

      - name: 设置应用名称与 queries 声明
        run: |
          sed -i 's/\r$//' tool/ci_patch_android.sh
          bash tool/ci_patch_android.sh

      - name: 拉取依赖
        run: |
          set +e
          flutter pub get 2>&1 | tee "$RUNNER_TEMP/pubget.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::flutter pub get 失败，下面是关键输出"
            tail -n 25 "$RUNNER_TEMP/pubget.log" | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "$status"
          fi

      - name: 构建 release APK
        run: |
          set +e
          flutter build apk --release 2>&1 | tee "$RUNNER_TEMP/build.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # 清理 ANSI 颜色码与回车符，得到可 grep 的纯文本日志
            tr '\r' '\n' < "$RUNNER_TEMP/build.log" | sed -e 's/\x1b\[[0-9;]*m//g' > "$RUNNER_TEMP/clean.log"
            REG=android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java
            DIAG="$RUNNER_TEMP/diag.txt"
            {
              echo "### 1. 编译/Gradle 错误块（含 symbol / location）"
              grep -n -B3 -A6 -E "error:|What went wrong|Caused by|FAILURE:|Execution failed" "$RUNNER_TEMP/clean.log" | head -n 120
              echo
              echo "### 2. GeneratedPluginRegistrant.java（前 40 行）"
              if [ -f "$REG" ]; then sed -n '1,40p' "$REG"; else echo "文件不存在：$REG"; fi
              echo
              echo "### 3. 参与 Android 构建的插件（name / package）"
              python3 -c "import json;d=json.load(open('.flutter-plugins-dependencies'));[print(p.get('name'),p.get('package')) for p in d['plugins']['android']]" 2>&1 || true
              echo
              echo "### 4. 原始日志最后 40 行"
              tail -n 40 "$RUNNER_TEMP/clean.log"
            } > "$DIAG"
            {
              echo "## 构建失败诊断（flutter build apk --release）"
              echo
              echo '```'
              cat "$DIAG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # 日志未登录不可见，但注解可匿名读取：把全部诊断压成一条注解
            flat=$(sed -e ':a;N;$!ba;s/\n/ | /g' "$DIAG" | cut -c1-6000)
            echo "::error::flutter build apk 失败 => $flat"
            exit "$status"
          fi

      - name: 上传 APK 到 Actions 产物
        uses: actions/upload-artifact@v4
        with:
          name: file_nest-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: 打 tag 时发布到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
