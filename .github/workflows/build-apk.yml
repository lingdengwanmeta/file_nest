name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: 接受 Android 许可
        run: yes | flutter doctor --android-licenses || true

      - name: 生成 Android 平台工程（脚手架）
        run: flutter create --org com.example --project-name file_nest --platforms android .

      - name: 还原业务代码与依赖清单
        run: git checkout -- lib pubspec.yaml

      - name: 设置应用名称与 queries 声明
        run: |
          sed -i 's/\r$//' tool/ci_patch_android.sh
          bash tool/ci_patch_android.sh

      - name: 拉取依赖
        run: flutter pub get

      - name: 构建 release APK
        run: flutter build apk --release

      - name: 上传 APK 到 Actions 产物
        uses: actions/upload-artifact@v4
        with:
          name: file_nest-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: 打 tag 时发布到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
